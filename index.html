  <!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Simple YouTube Clone</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
<h1>SimpleTube</h1>
<div class="controls">
<input id="search" placeholder="Search videos..." />
<button id="addBtn">Add video</button>
</div>
</header>


<main>
<section id="grid" class="grid"></section>
</main>


<div id="modal" class="modal hidden">
<div class="modal-content">
<button id="closeModal" class="close">✕</button>
<div id="playerWrap"></div>
<h2 id="modalTitle"></h2>
<p id="modalDesc"></p>
</div>
</div>


<template id="cardTpl">
<article class="card">
<div class="thumb"></div>
<h3 class="title"></h3>
</article>
</template>


<script src="app.js"></script>
</body>
</html>

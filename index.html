<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Vision — Payment Vouchers</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
<h1>High Vision</h1>
<div id="userArea"></div>
</header>


<main>
<section id="authSection" class="card hidden">
<h2>Sign in to High Vision</h2>
<input id="email" placeholder="Email" />
<input id="password" placeholder="Password" type="password" />
<button id="signInBtn">Sign in</button>
<button id="signUpBtn">Create account</button>
</section>


<section id="appSection" class="hidden">
<div class="controls">
<button id="newVoucherBtn">+ New Voucher</button>
<input id="search" placeholder="Search by client/project..." />
</div>
<div id="list" class="grid"></div>
</section>
</main>


<!-- Modal / Editor -->
<div id="editorModal" class="modal hidden"></div>


<!-- View-only page uses ?token=... -->


<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
